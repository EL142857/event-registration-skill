<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>抽奖</title>
<style>
/*__BASE_CSS__*/
.tabs{display:flex;gap:8px;margin:12px 0 14px}
.tab{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--text);font-size:16px;font-weight:600}
.tab.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.list{max-height:60vh;overflow:auto;border-top:1px solid var(--line);margin-top:10px}
.it{display:flex;align-items:center;gap:10px;padding:11px 6px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.it .no{color:var(--mute);font-size:12px;width:34px}
.it .nm{flex:1;font-size:16px}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.it.in .chk{background:var(--ok);border-color:var(--ok)}
.it.won .nm{text-decoration:line-through;color:var(--mute)}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:860px){.grid{grid-template-columns:3fr 2fr}}
.wheelbox{position:relative;width:100%;max-width:560px;margin:0 auto;aspect-ratio:1}
canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--acc);filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));z-index:2}
.spin{display:block;margin:16px auto 0;padding:15px 46px;font-size:20px;border-radius:40px}
.pool{display:flex;flex-wrap:wrap;gap:6px;max-height:40vh;overflow:auto;margin-top:10px}
.pool .chip b{margin-left:4px;color:var(--mute);font-weight:400;cursor:pointer}
.win{padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
.modal.on{display:flex}
.mbox{background:var(--card);border:2px solid var(--acc);border-radius:20px;padding:28px 22px;text-align:center;max-width:440px;width:100%}
.mbox .big{font-size:44px;font-weight:800;margin:10px 0 18px;color:var(--acc);word-break:break-word}
label.opt{font-size:13px;color:var(--mute);display:flex;gap:6px;align-items:center}
</style>
</head>
<body>
<div class="wrap" style="max-width:1100px">
  <h1 id="title"></h1>
  <p class="sub">抽奖状态只存在这台设备的浏览器里，请全程用同一台设备操作。</p>
  <div class="tabs">
    <button class="tab on" data-t="sign" type="button">① 加入奖池（<span id="tc">0</span>）</button>
    <button class="tab" data-t="draw" type="button">② 抽奖轮盘</button>
  </div>
  <section id="sign" class="card pad">
    <input type="search" id="q" placeholder="搜名字 / 拼音 / 首字母，点一下就加入奖池" autocomplete="off">
    <div class="row" style="margin-top:10px">
      <button class="chip on" data-f="all" type="button">全部</button><button class="chip" data-f="in" type="button">已加入</button><button class="chip" data-f="out" type="button">未加入</button>
      <span class="grow"></span>
      <button class="btn" id="addAll" type="button">当前列表全部加入</button>
      <button class="btn" id="addName" type="button">＋ 名单外的人</button>
    </div>
    <p class="sub" id="stat" style="margin:10px 0 0"></p>
    <div class="list" id="list"></div>
  </section>
  <section id="draw" hidden>
    <div class="grid">
      <div class="card pad">
        <div class="wheelbox"><div class="pointer"></div><canvas id="wheel" width="1000" height="1000"></canvas></div>
        <button class="btn pri spin" id="spin" type="button">开始抽奖</button>
        <div class="row" style="justify-content:center;margin-top:10px"><label class="opt"><input type="checkbox" id="rm"> 中奖后移出奖池（不会重复中奖）</label></div>
      </div>
      <div class="grid" style="grid-template-columns:1fr;align-content:start">
        <div class="card pad"><div class="row"><b class="grow">🏆 中奖名单</b><button class="btn" id="clrW" type="button">清空</button></div><div id="wins" class="sub" style="margin:8px 0 0">还没有人中奖</div></div>
        <div class="card pad"><div class="row"><b class="grow">奖池 <span id="pc">0</span> 人</b><button class="btn" id="back" type="button">去加人</button></div><div class="pool" id="chips"></div></div>
      </div>
    </div>
  </section>
</div>
<div class="modal" id="modal"><div class="mbox">
  <div style="font-size:18px">🎉 恭喜中奖 🎉</div>
  <div class="big" id="wname"></div>
  <div class="row" style="justify-content:center"><button class="btn pri" id="ok" type="button">好的</button><button class="btn" id="redo" type="button">不在场，重抽</button></div>
</div></div>
<script>
/*__BASE_JS__*/
const CFG = /*__CONFIG__*/null;
const D = /*__DATA__*/null;
const DC = CFG.draw || {};
const R = D.rows.map((r) => ({ id: 'k:' + r.k, n: r.name, no: r.no, py: r.py || '', staff: r.staff }));
const KEY = 'draw:' + CFG.event.name;
let S = { pool: [], extra: [], wins: [], rm: DC.remove_winner !== false };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) S = Object.assign(S, s); } catch (_) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (_) {} };
document.title = `${CFG.event.name} · ${DC.title || '抽奖'}`;
$('#title').textContent = `${DC.emoji || '🎁'} ${DC.title || '抽奖'} · ${CFG.event.name}`;
$('#rm').checked = S.rm;
let filt = 'all';
const people = () => R.concat(S.extra.map((e) => ({ id: e.id, n: e.n, no: '新', py: '' })));
const nameOf = (id) => people().find((x) => x.id === id)?.n || '?';
const inPool = (id) => S.pool.includes(id);
function cur() {
  const q = $('#q').value;
  return people().filter((p) => matchScore(q, [p.n, ...p.py.split(' ')], [p.no]) < 9 && (filt === 'all' || (filt === 'in') === inPool(p.id)));
}
function renderList() {
  const ws = new Set(S.wins.map((w) => w.id)), L = cur();
  $('#list').replaceChildren(...L.map((p) => h('div', { class: `it ${inPool(p.id) ? 'in' : ''} ${ws.has(p.id) ? 'won' : ''}`, onclick: () => { inPool(p.id) ? S.pool = S.pool.filter((x) => x !== p.id) : S.pool.push(p.id); save(); renderList(); } },
    h('span', { class: 'no', text: p.no }), h('span', { class: 'nm', text: p.n }), (p.staff || ws.has(p.id)) ? h('span', { class: 'tag', text: [p.staff ? (CFG.fields?.staff?.label || '工作人员') : '', ws.has(p.id) ? '已中奖' : ''].filter(Boolean).join(' · ') }) : null, h('span', { class: 'chk', text: inPool(p.id) ? '✓' : '' }))));
  if (!L.length) $('#list').append(h('p', { class: 'sub', text: '没有找到，可以点「＋ 名单外的人」' }));
  $('#stat').textContent = `奖池 ${S.pool.length} 人 · 名单 ${people().length} 人 · 当前显示 ${L.length} 人`;
  $('#tc').textContent = S.pool.length;
}
$('#q').addEventListener('input', renderList);
$$('[data-f]').forEach((b) => b.addEventListener('click', () => { filt = b.dataset.f; $$('[data-f]').forEach((x) => x.classList.toggle('on', x === b)); renderList(); }));
$('#addAll').addEventListener('click', () => { const L = cur().filter((p) => !inPool(p.id)); if (L.length && confirm(`把当前列表里 ${L.length} 人全部加入奖池？`)) { L.forEach((p) => S.pool.push(p.id)); save(); renderList(); } });
$('#addName').addEventListener('click', () => { const n = prompt('输入名字（名单外的人）'); if (!n?.trim()) return; const id = 'x' + Date.now(); S.extra.push({ id, n: n.trim() }); S.pool.push(id); save(); renderList(); });
function tab(t) { $$('.tab').forEach((x) => x.classList.toggle('on', x.dataset.t === t)); $('#sign').hidden = t !== 'sign'; $('#draw').hidden = t !== 'draw'; if (t === 'draw') { drawWheel(); renderSide(); } else renderList(); }
$$('.tab').forEach((t) => t.addEventListener('click', () => tab(t.dataset.t)));
$('#back').addEventListener('click', () => tab('sign'));
$('#rm').addEventListener('change', (e) => { S.rm = e.target.checked; save(); });

const cv = $('#wheel'), cx = cv.getContext('2d'); let ang = 0, spinning = false;
const COLS = ['#4f46e5', '#f59e0b', '#0f766e', '#db2777', '#7c3aed', '#ea580c', '#0369a1', '#65a30d'];
function drawWheel() {
  const P = S.pool, n = P.length, W = 1000, c = W / 2, r = c - 12; cx.clearRect(0, 0, W, W);
  cx.beginPath(); cx.arc(c, c, r + 8, 0, 7); cx.fillStyle = '#111'; cx.fill();
  if (!n) { cx.fillStyle = '#fff'; cx.font = 'bold 44px sans-serif'; cx.textAlign = 'center'; cx.fillText('奖池还没有人', c, c); return; }
  const a = 2 * Math.PI / n;
  for (let i = 0; i < n; i++) {
    const s = ang + i * a - Math.PI / 2; cx.beginPath(); cx.moveTo(c, c); cx.arc(c, c, r, s, s + a); cx.closePath();
    cx.fillStyle = COLS[(n % COLS.length === 1 && i === n - 1) ? 2 : i % COLS.length]; cx.fill();
    if (n <= 150) { cx.save(); cx.translate(c, c); cx.rotate(s + a / 2); cx.textAlign = 'right'; cx.textBaseline = 'middle'; cx.fillStyle = '#fff';
      cx.font = `600 ${Math.max(12, Math.min(40, a * r * 0.55))}px -apple-system,"PingFang SC",sans-serif`; let t = nameOf(P[i]); if (t.length > 10) t = t.slice(0, 10) + '…'; cx.fillText(t, r - 22, 0); cx.restore(); }
  }
  cx.beginPath(); cx.arc(c, c, 62, 0, 7); cx.fillStyle = '#111'; cx.fill(); cx.font = '60px sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText(DC.emoji || '🎁', c, c + 4);
}
function renderSide() {
  $('#pc').textContent = S.pool.length;
  $('#chips').replaceChildren(...S.pool.map((id) => h('span', { class: 'chip' }, nameOf(id), h('b', { text: '✕', onclick: () => { if (spinning) return; S.pool = S.pool.filter((x) => x !== id); save(); drawWheel(); renderSide(); } }))));
  $('#wins').replaceChildren(...(S.wins.length ? S.wins.map((w, i) => h('div', { class: 'win' }, h('span', null, `${i + 1}. `, h('b', { text: w.n })), h('span', { class: 'muted', text: w.t }))) : ['还没有人中奖']));
}
$('#clrW').addEventListener('click', () => { if (confirm('清空中奖名单？（不会把人放回奖池）')) { S.wins = []; save(); renderSide(); } });
let lastWin = null;
$('#spin').addEventListener('click', () => {
  const n = S.pool.length; if (spinning) return; if (!n) { alert('奖池是空的，先去加人'); return; }
  spinning = true; $('#spin').disabled = true;
  const a = 2 * Math.PI / n, k = crypto.getRandomValues(new Uint32Array(1))[0] % n, off = (0.15 + 0.7 * Math.random()) * a;
  const T = 2 * Math.PI, base = ang - (ang % T);
  const target = base + (((-(k * a + off)) % T) + T) % T + T * (6 + Math.floor(Math.random() * 3));
  const from = ang, dur = 6000, t0 = performance.now();
  (function step(t) { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 4); ang = from + (target - from) * e; drawWheel();
    if (p < 1) requestAnimationFrame(step); else { spinning = false; $('#spin').disabled = false; win(S.pool[k]); } })(t0);
});
function win(id) {
  const n = nameOf(id); lastWin = { id, n, t: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) };
  S.wins.push(lastWin); if (S.rm) S.pool = S.pool.filter((x) => x !== id); save();
  $('#wname').textContent = n; $('#modal').classList.add('on'); renderSide();
}
$('#ok').addEventListener('click', () => { $('#modal').classList.remove('on'); drawWheel(); });
$('#redo').addEventListener('click', () => { if (lastWin) { S.wins.pop(); S.pool = S.pool.filter((x) => x !== lastWin.id); save(); renderSide(); drawWheel(); } $('#modal').classList.remove('on'); setTimeout(() => $('#spin').click(), 300); });
renderList();
</script>
</body>
</html>
